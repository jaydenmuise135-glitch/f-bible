name: Build Android APK

on:
workflow_dispatch:
push:
branches: [ main, master ]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Get source code
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract Bible text
    run: |
      mkdir -p public/bible
      unzip -o bible-text.zip.zip -d public/bible
      echo "Bible files extracted successfully"
      find public/bible -type f | head -30

  - name: Install dependencies
    run: npm install

  - name: Build Bible app
    run: npm run build

  - name: Create Android project
    run: npx cap add android

  - name: Sync web app into Android project
    run: npx cap sync android

  - name: Build APK
    run: cd android && chmod +x gradlew && ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: basic-kjv-bible-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
